# AI Model Configuration
gemini.api.key=${GEMINI_API_KEY}

# Model Names
gemini.text.model=gemini-2.0-flash-exp
gemini.imagen.model=imagen-3.0-generate-002
gemini.veo.model=veo-3.1-generate-001

# Image Generation Settings
imagen.number.of.images=1
imagen.output.mime.type=image/jpeg

# Video Generation Settings
veo.number.of.videos=1
veo.duration.seconds=8
veo.enhance.prompt=true
veo.poll.interval.seconds=10
veo.max.wait.minutes=30

# File Storage
storage.temp.dir=./temp
storage.output.dir=./output

# Video Processing
video.output.format=mp4
video.frame.rate=30
video.codec=h264

# Retry Settings (for handling 429 Rate Limit errors)
retry.max.attempts=5
retry.initial.delay.ms=5000
retry.max.delay.ms=60000

# Google Cloud Storage Configuration (Recommended for Vertex AI)
gcs.bucket.name=my-animation-assets-123

# Aliyun OSS Configuration (Optional/Legacy)
# These values are read from environment variables:
# - ALIYUN_OSS_ENDPOINT: OSS endpoint (e.g., oss-cn-hangzhou.aliyuncs.com)
# - ALIYUN_OSS_ACCESS_KEY_ID: Access Key ID
# - ALIYUN_OSS_ACCESS_KEY_SECRET: Access Key Secret
# - ALIYUN_OSS_BUCKET_NAME: Bucket name
